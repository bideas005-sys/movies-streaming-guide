<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamScope Guide — Find Where to Watch Movies Legally</title>
  <meta name="description" content="Discover where to legally stream, rent, or buy blockbuster movies across Netflix, Prime Video, Max, Disney+, and Apple TV." />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header with Play Button + Website Name -->
  <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Play Icon Logo + Brand Name -->
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 group-hover:bg-amber-500/20 transition">
          <svg class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <span class="text-xl font-extrabold tracking-tight text-white">
          Stream<span class="text-amber-400">Scope</span>
        </span>
      </a>

      <!-- Navigation Links -->
      <nav aria-label="Main Navigation" class="flex gap-6 text-sm text-slate-300">
        <a href="index.html" class="text-amber-400 font-semibold transition">Home</a>
        <a href="about.html" class="hover:text-amber-400 transition">About</a>
        <a href="contact.html" class="hover:text-amber-400 transition">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section & Search -->
  <section class="max-w-6xl mx-auto px-4 pt-12 pb-8 text-center">
    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white mb-4">
      Find Where to Stream Your Next Favorite Movie
    </h1>
    <p class="text-slate-400 max-w-2xl mx-auto mb-8 text-base md:text-lg">
      Explore verified legal streaming platforms, rental options, and editorial reviews for top blockbuster films.
    </p>

    <!-- Search & Filter Bar -->
    <div class="max-w-2xl mx-auto flex flex-col sm:flex-row gap-3">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search movies by title..." 
        class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-amber-500"
      />
      <select 
        id="genre-filter" 
        class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-amber-500"
      >
        <option value="All">All Genres</option>
        <option value="Action">Action</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Drama">Drama</option>
        <option value="Adventure">Adventure</option>
        <option value="Crime">Crime</option>
        <option value="Animation">Animation</option>
      </select>
    </div>
  </section>

  <!-- Movies Grid Container -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="movies-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 bg-slate-900/60 mt-12">
    <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-slate-400">
      <p>&copy; 2026 StreamScope Guide. All rights reserved.</p>
      <div class="flex gap-6">
        <a href="privacy.html" class="hover:text-amber-400 transition">Privacy Policy</a>
        <a href="terms.html" class="hover:text-amber-400 transition">Terms of Service</a>
        <a href="contact.html" class="hover:text-amber-400 transition">Contact</a>
      </div>
    </div>
  </footer>

  <!-- JavaScript Section -->
  <script>
    const TMDB_API_KEY = "Y9c0f9a075f8e2a619ccbf639bb2ae895";

    const moviesData = [
      {
        slug: "oppenheimer",
        title: "Oppenheimer",
        tmdb_id: 872585,
        release_year: 2023,
        rating: "R",
        genres: ["Drama", "History"],
        synopsis: "During World War II, Lt. Gen. Leslie Groves Jr. appoints physicist J. Robert Oppenheimer to work on the top-secret Manhattan Project."
      },
      {
        slug: "dune-part-two",
        title: "Dune: Part Two",
        tmdb_id: 693134,
        release_year: 2024,
        rating: "PG-13",
        genres: ["Sci-Fi", "Adventure"],
        synopsis: "Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family."
      },
      {
        slug: "inception",
        title: "Inception",
        tmdb_id: 27205,
        release_year: 2010,
        rating: "PG-13",
        genres: ["Action", "Sci-Fi", "Thriller"],
        synopsis: "A thief who steals corporate secrets through dream-sharing technology is given the inverse task of planting an idea."
      },
      {
        slug: "interstellar",
        title: "Interstellar",
        tmdb_id: 157336,
        release_year: 2014,
        rating: "PG-13",
        genres: ["Adventure", "Drama", "Sci-Fi"],
        synopsis: "When Earth becomes uninhabitable in the future, a farmer and ex-NASA pilot is tasked to pilot a spacecraft to find a new planet."
      },
      {
        slug: "the-dark-knight",
        title: "The Dark Knight",
        tmdb_id: 155,
        release_year: 2008,
        rating: "PG-13",
        genres: ["Action", "Crime", "Drama"],
        synopsis: "When the menace known as the Joker wreaks havoc and chaos on Gotham, Batman faces his greatest psychological and physical test."
      },
      {
        slug: "gladiator-ii",
        title: "Gladiator II",
        tmdb_id: 558449,
        release_year: 2024,
        rating: "R",
        genres: ["Action", "Adventure", "Drama"],
        synopsis: "Years after witnessing the death of Maximus, Lucius must enter the Colosseum after Roman conquerors take his home."
      },
      {
        slug: "deadpool-and-wolverine",
        title: "Deadpool & Wolverine",
        tmdb_id: 533535,
        release_year: 2024,
        rating: "R",
        genres: ["Action", "Comedy", "Sci-Fi"],
        synopsis: "Deadpool's peaceful existence crashes down when the TVA recruits him for a mission alongside a reluctant Wolverine."
      },
      {
        slug: "inside-out-2",
        title: "Inside Out 2",
        tmdb_id: 1022789,
        release_year: 2024,
        rating: "PG",
        genres: ["Animation", "Family", "Comedy", "Adventure"],
        synopsis: "New emotions like Anxiety and Envy arrive at teenager Riley's mind headquarters to shake things up."
      },
      {
        slug: "john-wick-chapter-4",
        title: "John Wick: Chapter 4",
        tmdb_id: 603692,
        release_year: 2023,
        rating: "R",
        genres: ["Action", "Crime", "Thriller"],
        synopsis: "John Wick uncovers a path to defeating The High Table while facing off against powerful enemies across the globe."
      },
      {
        slug: "the-batman",
        title: "The Batman",
        tmdb_id: 414906,
        release_year: 2022,
        rating: "PG-13",
        genres: ["Action", "Crime", "Drama"],
        synopsis: "When a sadistic serial killer begins murdering key political figures in Gotham, Batman investigates the city's hidden corruption."
      }
    ];

    const posterCache = {};

    async function fetchPoster(tmdbId) {
      if (posterCache[tmdbId]) return posterCache[tmdbId];
      if (!TMDB_API_KEY || TMDB_API_KEY === "YOUR_TMDB_API_KEY_HERE") {
        return "https://via.placeholder.com/500x750/1e293b/f8fafc?text=Add+TMDB+Key";
      }
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        const url = data.poster_path ? `https://image.tmdb.org/t/p/w500${data.poster_path}` : "https://via.placeholder.com/500x750/1e293b/f8fafc?text=No+Poster";
        posterCache[tmdbId] = url;
        return url;
      } catch (err) {
        return "https://via.placeholder.com/500x750/1e293b/f8fafc?text=No+Poster";
      }
    }

    async function renderMovies(list) {
      const container = document.getElementById("movies-grid");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12">No movies found matching your search.</p>`;
        return;
      }

      for (const movie of list) {
        const posterUrl = await fetchPoster(movie.tmdb_id);
        
        // Poora card ab <a> tag hai taake kahin bhi click karne par detail page khule
        const card = document.createElement("a");
        card.href = `movie.html?slug=${movie.slug}`;
        card.className = "group bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg hover:border-amber-500/50 hover:-translate-y-1 transition-all duration-200 flex flex-col cursor-pointer";
        
        card.innerHTML = `
          <div class="relative overflow-hidden">
            <img src="${posterUrl}" alt="${movie.title}" class="w-full h-80 object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
            <span class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur text-amber-400 text-xs font-bold px-2.5 py-1 rounded-md border border-slate-700">
              ${movie.rating}
            </span>
          </div>
          <div class="p-4 flex flex-col flex-grow">
            <div class="text-xs text-amber-400 font-medium mb-1">${movie.genres.join(" • ")}</div>
            <h2 class="text-lg font-bold text-white group-hover:text-amber-400 transition mb-2">${movie.title} (${movie.release_year})</h2>
            <p class="text-sm text-slate-400 mb-4 line-clamp-2">${movie.synopsis}</p>
            <div class="mt-auto bg-amber-500 group-hover:bg-amber-600 text-slate-950 font-semibold py-2.5 px-4 rounded-lg text-center text-sm transition">
              Where to Watch
            </div>
          </div>
        `;
        
        container.appendChild(card);
      }
    }

    function filterMovies() {
      const searchText = document.getElementById("search-input").value.toLowerCase();
      const selectedGenre = document.getElementById("genre-filter").value;

      const filtered = moviesData.filter(movie => {
        const matchesSearch = movie.title.toLowerCase().includes(searchText);
        const matchesGenre = selectedGenre === "All" || movie.genres.includes(selectedGenre);
        return matchesSearch && matchesGenre;
      });

      renderMovies(filtered);
    }

    document.getElementById("search-input").addEventListener("input", filterMovies);
    document.getElementById("genre-filter").addEventListener("change", filterMovies);

    renderMovies(moviesData);
  </script>
</body>
</html>
