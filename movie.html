    async function fetchPoster(tmdbId) {
      if (!TMDB_API_KEY || TMDB_API_KEY === "YOUR_TMDB_API_KEY_HERE") {
        return "https://via.placeholder.com/500x750/1e293b/f8fafc?text=Add+TMDB+Key";
      }
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        return data.poster_path ? `https://image.tmdb.org/t/p/w500${data.poster_path}` : "https://via.placeholder.com/500x750/1e293b/f8fafc?text=No+Poster";
      } catch (err) {
        return "https://via.placeholder.com/500x750/1e293b/f8fafc?text=No+Poster";
      }
    }

    async function loadMovieDetail() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const container = document.getElementById("movie-detail-container");

      const movie = moviesData.find(m => m.slug === slug);

      if (!movie) {
        container.innerHTML = `
          <div class="text-center py-20 bg-slate-900 border border-slate-800 rounded-2xl p-8">
            <h1 class="text-2xl font-bold text-white mb-3">Movie Guide Not Found</h1>
            <p class="text-slate-400 mb-6">Sorry, we couldn't find the streaming guide for this title.</p>
            <a href="index.html" class="inline-block bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-6 py-3 rounded-xl transition">Back to All Movies</a>
          </div>
        `;
        return;
      }

      document.title = `Where to Watch ${movie.title} (${movie.release_year}) — StreamScope`;
      const posterUrl = await fetchPoster(movie.tmdb_id);

      const streamingButtons = movie.streaming_options.map(opt => `
        <a href="${opt.url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-amber-500/50 p-4 rounded-xl transition group">

            <div class="font-bold text-white group-hover:text-amber-400 transition">${opt.platform}</div>
            <div class="text-xs text-slate-400">${opt.type}</div>
          </div>
          <span class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg">Watch Now &rarr;</span>
        </a>
      `).join("");

        </a>
