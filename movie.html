<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 group-hover:bg-amber-500/20 transition">
          <svg class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <span class="text-xl font-extrabold tracking-tight text-white">
          Stream<span class="text-amber-400">Scope</span>
        </span>
      </a>

      <nav aria-label="Main Navigation" class="flex gap-6 text-sm text-slate-300">

  <!-- Movie Details Container -->
  <main id="movie-detail-container" class="max-w-5xl mx-auto px-4 py-12 flex-grow w-full">
    <div class="text-center text-slate-400 py-20">Loading movie details...</div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 bg-slate-900/60 mt-12">
    <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-slate-400">
      <p>&copy; 2026 StreamScope Guide. All rights reserved.</p>
      <div class="flex gap-6">
        <a href="privacy.html" class="hover:text-amber-400 transition">Privacy Policy</a>
        <a href="terms.html" class="hover:text-amber-400 transition">Terms of Service</a>
        <a href="contact.html" class="hover:text-amber-400 transition">Contact</a>
      </div>
    </div>
  </footer>

  <!-- External Movies Database -->
  <script src="movies.js"></script>

  <!-- Detail Page Script -->
  <script>
    const TMDB_API_KEY = "9c0f9a075f8e2a619ccbf639bb2ae895";

    async function fetchPoster(tmdbId) {
      if (!TMDB_API_KEY || TMDB_API_KEY === "YOUR_TMDB_API_KEY_HERE") {
        return "https://via.placeholder.com/500x750/1e293b/f8fafc?text=Add+TMDB+Key";
      }
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        return data.poster_path 
          ? `https://image.tmdb.org/t/p/w500${data.poster_path}` 
          : "https://via.placeholder.com/500x750/1e293b/f8fafc?text=No+Poster";
      } catch (err) {
        return "https://via.placeholder.com/500x750/1e293b/f8fafc?text=No+Poster";
      }
    }

    async function loadMovieDetail() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const container = document.getElementById("movie-detail-container");

      if (typeof moviesData === "undefined") {
        container.innerHTML = `<div class="text-center text-red-400 py-20">Error: movies.js file nahi mili!</div>`;
        return;
      }

      const movie = moviesData.find(m => m.slug === slug);

      if (!movie) {
        container.innerHTML = `
          <div class="text-center py-20 bg-slate-900 border border-slate-800 rounded-2xl p-8">
            <h1 class="text-2xl font-bold text-white mb-3">Movie Guide Not Found</h1>
            <p class="text-slate-400 mb-6">Sorry, we couldn't find the streaming guide for this title.</p>
            <a href="index.html" class="inline-block bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-6 py-3 rounded-xl transition">Back to All Movies</a>
          </div>
        `;
        return;
      }

      document.title = `Where to Watch ${movie.title} (${movie.release_year}) — StreamScope`;
      const posterUrl = await fetchPoster(movie.tmdb_id);

      const streamingButtons = (movie.streaming_options || []).map(opt => `
        <a href="${opt.url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-amber-500/50 p-4 rounded-xl transition group">
          <div>
            <div class="font-bold text-white group-hover:text-amber-400 transition">${opt.platform}</div>
            <div class="text-xs text-slate-400">${opt.type}</div>
          </div>
          <span class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg">Watch Now &rarr;</span>
        </a>
      `).join("");

      container.innerHTML = `
        <a href="index.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-amber-400 mb-8 transition">
          &larr; Back to Movies
        </a>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">
          <div class="rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
            <img src="${posterUrl}" alt="${movie.title}" class="w-full h-auto object-cover" />
          </div>

          <div class="md:col-span-2 space-y-6">
            <div>
              <div class="flex flex-wrap items-center gap-3 text-xs font-semibold mb-3">
                <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-md">${movie.rating || "PG-13"}</span>
                <span class="text-slate-400">${movie.release_year}</span>
                <span class="text-slate-600">&bull;</span>
                <span class="text-slate-400">${movie.runtime || "120 min"}</span>
                <span class="text-slate-600">&bull;</span>
                <span class="text-amber-400">${(movie.genres || []).join(", ")}</span>
              </div>
              <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight">${movie.title}</h1>
            </div>

            <p class="text-slate-300 leading-relaxed text-base md:text-lg">${movie.synopsis}</p>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
              <h2 class="text-lg font-bold text-white mb-4">Where to Watch Legally</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${streamingButtons}
              </div>
            </div>

            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6">
              <h2 class="text-lg font-bold text-amber-400 mb-2">Editorial Review</h2>
              <p class="text-slate-300 leading-relaxed">${movie.editorial_review || ""}</p>
            </div>
          </div>
        </div>
      `;
    }

    loadMovieDetail();
  </script>
</body>
